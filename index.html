<style>
/* Reset básico */
*{
margin:0;
padding:border-box;

}


body{
    font-famify:'segoe UI',tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f4f9;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
    min-height:100vh;
}


/*Container principal-centralizado*/
.container{
max-width: 800px;
width:100%;
display:flex;
flex-direction:column;
alimg-items:center;
}


/*Cabeçalho*/
header{
    background-color:#183c63 ;
    color:#ffffff;
    padding:24px 16px;
    border:5px solid #cf1010;
    width: 100%;
}


header h1{
    font-size:2.2rem;
    letter-spacing: 1px;
    margin-bottom:6px;
}


header p{
    font-size:1.1rem;
    color:#d6e4f0;
}


header .logo{
    max-width:100%;
    margin-bottom:10px;
border-radius:4px;
}


/*Conteúdo principal*/
main{
    background-color:#ffffff;
    color:#1a1a2e;
    padding: 32px 24px;
    border-left:5px solid#cf1010;
    border-right:5px solid #cf1010;
    border-bottom:5px solid #cf1010;
    border-radius:0 0 12px 12px;
    text-aling:center;
    line-height:1.6;
    width:100%; 
}


main h2 {
    color:#183c63;
    font-size:1.8rem;
    margin-bottom:8px;
}


.autor{
    font-weight:bold;
    color:#2a5a8a;
    margin-bottom:16px;
}


main p{
    font-size:1rem;
    margin-bottom: 12px;
}


/*Imagens-estilizadas e responsivas*/
main.destaque{
    max-width:100%;
    height:auto;
    border-radius:8px;
    margin:16px 0;
    box-shadow:0 4px 8px rgba(0,0,0,0.15);
}


/*Botões de like*/


botoes-like{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
    flex-wrap;
}


.botoes-like button{
    backgroud:#f0f0f5;
    bonder:none;
    bonder-radius:30px;
    padding:10px 24px;
    flex-items:center;
    gap:8px;
    transition:background 0.2, transform 0.1s;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
}


.botoes-like button:hover{
    background:#e0e0ea;
    transform: scale(1.02);
}
